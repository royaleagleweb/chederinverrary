name: Deploy to Cloudflare Workers

# Publishes the static site (index.html + the email-db tool and its data
# files) to Cloudflare Workers on every push to main. No build step — the
# Worker serves the repo as static assets (see wrangler.toml).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy with Wrangler
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account is selected via env var; wrangler v4 removed the
          # --account-id flag that made the previous workflow fail.
          CLOUDFLARE_ACCOUNT_ID: 2b8bb2834c3942b88a71e4f6e2b968e2
