name: Deploy to GitHub Pages

# Publishes the static site (including email-db.html and the email data files)
# to GitHub Pages on every push to main. The whole repo root is the site;
# there is no build step.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this workflow to enable Pages and publish the artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on automatically if it isn't already enabled.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
